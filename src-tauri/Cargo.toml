[package]
name = "megaball-neo"
version = "1.0.0"
description = "Megaball Neo — a modern tribute to the Amiga classic"
authors = ["Loxy"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
